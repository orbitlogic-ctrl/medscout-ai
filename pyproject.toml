[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "medscout"
version = "0.1.0"
description = "A synthetic healthcare facilities catalog for Emilia-Romagna"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.2"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
medscout = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
